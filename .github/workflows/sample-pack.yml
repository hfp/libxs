name: Sample Pack

permissions:
  contents: read

# Manual only: a quick look at a code path on the server-class CPUs runners happen
# to land on. Runners differ per job, hence several of them, and a job on a CPU
# without AVX-512 still gives AVX2 numbers. Every job compares a build with AVX-512
# and one limited to AVX2 on the same CPU: compare within a job, not across jobs.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments of pack.x (synthetic values) unless a file is given"
        default: "8388608 24 12 10 10"
      file_url:
        description: "URL of an MHD file for pack.x (HTTPS), replaces the arguments"
        default: ""
      env:
        description: "Environment for all steps, e.g., RECORD=1024"
        default: "REPEAT=7"
      baseline:
        description: "Revision built as well (whole tree, same formats), full hash if amended"
        default: ""
      formats:
        description: "Values of LIBXS_PACK to run (the sample shows every level; 0: the default)"
        default: "0"

jobs:
  Pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6]
    env:
      INPUT_ARGS: ${{ github.event.inputs.args }}
      FILE_URL: ${{ github.event.inputs.file_url }}
      BASELINE: ${{ github.event.inputs.baseline }}
      FORMATS: ${{ github.event.inputs.formats }}
    steps:
    - uses: actions/checkout@v7

    - name: System Information
      run: |
        MODEL=$(lscpu --extended=MODELNAME 2>/dev/null | tail -n1)
        # LIBXS_X86_AVX512 includes VNNI, otherwise the AVX-512 paths stay off
        ISA=$(grep -qw avx512_vnni /proc/cpuinfo && echo "AVX-512" || echo "AVX2 or less")
        echo "${MODEL} (${ISA})"
        echo "### ${MODEL} (${ISA})" >> "$GITHUB_STEP_SUMMARY"

    # Space-separated NAME=VALUE pairs given when launching manually. They come
    # in through the environment rather than the script, so no value is executed.
    - name: Setup environment
      if: github.event.inputs.env != ''
      env:
        INPUT_ENV: ${{ github.event.inputs.env }}
      run: |
        for NAME_VALUE in ${INPUT_ENV}; do
          if ! echo "${NAME_VALUE}" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$'; then
            echo "ERROR: \"${NAME_VALUE}\" is not NAME=VALUE"; exit 1
          fi
          echo "${NAME_VALUE}" >> $GITHUB_ENV
          echo "${NAME_VALUE}"
        done

    # vpack.f is the code used without LIBXS (the sample leaves it out without a compiler)
    - name: Install GNU Fortran
      run: |
        sudo apt update -y
        sudo apt install -y gfortran

    # Both at the same static target (SSE=4: the CPU check can yield -march=native,
    # which makes the whole build AVX-512), so only the dispatch cap differs.
    - name: Build
      working-directory: samples/pack
      run: |
        make -j "$(nproc)" SSE=4
        mv pack.x pack-avx512.x
        make clean
        make -j "$(nproc)" SSE=4 EFLAGS=-DLIBXS_MAX_STATIC_TARGET_ARCH=1006
        mv pack.x pack-avx2.x
        if nm pack-avx2.x | grep -q _avx512; then
          echo "ERROR: the AVX2 build contains AVX-512 code"; exit 1
        fi

    # The same at the CPU's own width (SSE=0: -march=native), where vpack.f vectorizes.
    - name: Build native
      working-directory: samples/pack
      run: |
        make clean
        make -j "$(nproc)" SSE=0
        mv pack.x pack-native.x

    # The baseline's whole tree in a worktree, built as the first two above.
    - name: Build baseline
      if: github.event.inputs.baseline != ''
      working-directory: samples/pack
      run: |
        if ! echo "${BASELINE}" | grep -qE '^[0-9A-Za-z._/-]+$'; then
          echo "ERROR: \"${BASELINE}\" is not a revision"; exit 1
        fi
        # A full hash is fetched even if amended away, an abbreviated one needs the history.
        if git fetch --quiet --depth=1 origin "${BASELINE}" 2>/dev/null; then
          REVISION=$(git rev-parse FETCH_HEAD)
        else
          git fetch --quiet --unshallow origin
          REVISION=$(git rev-parse --verify --quiet "${BASELINE}^{commit}" || true)
        fi
        if [ "" = "${REVISION}" ] || ! git cat-file -e "${REVISION}:samples/pack/Makefile" 2>/dev/null; then
          echo "ERROR: \"${BASELINE}\" is not found, an amended revision needs the full hash"; exit 1
        fi
        BASEDIR="${RUNNER_TEMP}/baseline"
        git worktree add --detach "${BASEDIR}" "${REVISION}"
        make -C "${BASEDIR}/samples/pack" -j "$(nproc)" SSE=4
        mv "${BASEDIR}/samples/pack/pack.x" pack-base-avx512.x
        make -C "${BASEDIR}/samples/pack" clean
        make -C "${BASEDIR}/samples/pack" -j "$(nproc)" SSE=4 EFLAGS=-DLIBXS_MAX_STATIC_TARGET_ARCH=1006
        mv "${BASEDIR}/samples/pack/pack.x" pack-base-avx2.x
        if nm pack-base-avx2.x | grep -q _avx512; then
          echo "ERROR: the AVX2 build contains AVX-512 code"; exit 1
        fi

    - name: Download
      if: github.event.inputs.file_url != ''
      working-directory: samples/pack
      run: curl -fsSL --proto '=https' -o input.mhd "${FILE_URL}"

    # One shot per job, with the first build again at the end to show the noise.
    # Pinned to the last CPU, the runner's own work more likely lands on the first.
    - name: Run
      working-directory: samples/pack
      shell: bash # pipefail: a failed round trip must not disappear behind tee
      run: |
        if [ "" != "${FILE_URL}" ]; then INPUT_ARGS=input.mhd; fi
        if ! echo "${FORMATS}" | grep -qE '^[0-9 ]+$'; then
          echo "ERROR: \"${FORMATS}\" is not a list of numbers"; exit 1
        fi
        CPU=$(($(nproc) - 1))
        BUILDS="avx512 avx2 native avx512-again"
        if [ "" != "${BASELINE}" ]; then BUILDS="avx512 base-avx512 avx2 base-avx2 native avx512-again"; fi
        for BUILD in ${BUILDS}; do
          LABEL="${BUILD}"
          if [ "${BUILD#base-}" != "${BUILD}" ]; then LABEL="${BUILD} (${BASELINE})"; fi
          for FORMAT in ${FORMATS}; do # LIBXS_PACK: level 0; a baseline from before reads LIBXS_VPACK (1: Rice)
            echo "--- ${LABEL}, LIBXS_PACK=${FORMAT}" | tee -a "pack-${{ matrix.job }}.log"
            LIBXS_PACK=${FORMAT} LIBXS_VPACK=$((3 == FORMAT ? 1 : 0)) taskset -c "${CPU}" "./pack-${BUILD%-again}.x" \
              ${INPUT_ARGS} | tee -a "pack-${{ matrix.job }}.log"
          done
        done
        {
          echo '```'
          grep -E '^(--- |variant|vpack (group )?8 |vpack level |fortran group 8|vpack deltas|kd-tree rows, exc)' "pack-${{ matrix.job }}.log"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v7
      # format() keeps an unset UPLOAD a string: null != '0' is false (both coerce to 0)
      if: always() && format('{0}', env.UPLOAD) != '0'
      with:
        name: pack-${{ matrix.job }}
        path: samples/pack/pack-${{ matrix.job }}.log
