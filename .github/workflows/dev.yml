name: Dev

permissions:
  contents: read

# Manual only: a quick look at a code path on the server-class CPUs runners happen
# to land on. Runners differ per job, hence several of them, and a job on a CPU
# without AVX-512 still gives AVX2 numbers. Pack compares two ISA caps; Predict
# runs parameter samples. Compare timings within a job, not across jobs.
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Sample experiment"
        type: choice
        options: [pack, predict, both]
        default: pack
      args:
        description: "Arguments of pack.x (synthetic values) unless a file is given"
        default: "8388608 24 12 10 10"
      predict_args:
        description: "Arguments of predict_params.x"
        default: "0.8 mix xgb"
      file_url:
        description: "URL of an MHD file for pack.x (HTTPS), replaces the arguments"
        default: ""
      predict_file_url:
        description: "Optional HTTPS CSV input for predict_params.x"
        default: ""
      holdout_url:
        description: "Optional HTTPS test CSV for predict (requires predict_file_url)"
        default: ""
      env:
        description: "Environment for all steps, e.g., RECORD=1024"
        default: "REPEAT=7"
      baseline:
        description: "Revision whose src/libxs_pack.c also runs (LIBXS_VPACK=1), e.g., 708b79b"
        default: ""

jobs:
  Pack:
    if: github.event.inputs.experiment != 'predict'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6]
    env:
      INPUT_ARGS: ${{ github.event.inputs.args }}
      FILE_URL: ${{ github.event.inputs.file_url }}
      BASELINE: ${{ github.event.inputs.baseline }}
    steps:
    - uses: actions/checkout@v5

    - name: System Information
      run: |
        MODEL=$(lscpu --extended=MODELNAME 2>/dev/null | tail -n1)
        # LIBXS_X86_AVX512 includes VNNI, otherwise the AVX-512 paths stay off
        ISA=$(grep -qw avx512_vnni /proc/cpuinfo && echo "AVX-512" || echo "AVX2 or less")
        echo "${MODEL} (${ISA})"
        echo "### ${MODEL} (${ISA})" >> "$GITHUB_STEP_SUMMARY"

    # Space-separated NAME=VALUE pairs given when launching manually. They come
    # in through the environment rather than the script, so no value is executed.
    - name: Setup environment
      if: github.event.inputs.env != ''
      env:
        INPUT_ENV: ${{ github.event.inputs.env }}
      run: |
        for NAME_VALUE in ${INPUT_ENV}; do
          if ! echo "${NAME_VALUE}" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$'; then
            echo "ERROR: \"${NAME_VALUE}\" is not NAME=VALUE"; exit 1
          fi
          echo "${NAME_VALUE}" >> $GITHUB_ENV
          echo "${NAME_VALUE}"
        done

    # Both at the same static target (SSE=4: the CPU check can yield -march=native,
    # which makes the whole build AVX-512), so only the dispatch cap differs.
    - name: Build
      working-directory: samples/pack
      run: |
        make -j "$(nproc)" FORTRAN=0 SSE=4
        mv pack.x pack-avx512.x
        make clean
        make -j "$(nproc)" FORTRAN=0 SSE=4 EFLAGS=-DLIBXS_MAX_STATIC_TARGET_ARCH=1006
        mv pack.x pack-avx2.x
        if nm pack-avx2.x | grep -q _avx512; then
          echo "ERROR: the AVX2 build contains AVX-512 code"; exit 1
        fi

    # The same two builds with the baseline's src/libxs_pack.c, then the file restored.
    - name: Build baseline
      if: github.event.inputs.baseline != ''
      working-directory: samples/pack
      run: |
        if ! echo "${BASELINE}" | grep -qE '^[0-9A-Za-z._/-]+$'; then
          echo "ERROR: \"${BASELINE}\" is not a revision"; exit 1
        fi
        git fetch --quiet --unshallow origin # the checkout is shallow
        git show "${BASELINE}:src/libxs_pack.c" > ../../src/libxs_pack.c
        make clean
        make -j "$(nproc)" FORTRAN=0 SSE=4
        mv pack.x pack-base-avx512.x
        make clean
        make -j "$(nproc)" FORTRAN=0 SSE=4 EFLAGS=-DLIBXS_MAX_STATIC_TARGET_ARCH=1006
        mv pack.x pack-base-avx2.x
        git checkout -- ../../src/libxs_pack.c
        if nm pack-base-avx2.x | grep -q _avx512; then
          echo "ERROR: the AVX2 build contains AVX-512 code"; exit 1
        fi

    - name: Download
      if: github.event.inputs.file_url != ''
      working-directory: samples/pack
      run: curl -fsSL --proto '=https' -o input.mhd "${FILE_URL}"

    # One shot per job, with the first build again at the end to show the noise.
    # Pinned to the last CPU, the runner's own work more likely lands on the first.
    - name: Run
      working-directory: samples/pack
      shell: bash # pipefail: a failed round trip must not disappear behind tee
      run: |
        if [ "" != "${FILE_URL}" ]; then INPUT_ARGS=input.mhd; fi
        CPU=$(($(nproc) - 1))
        BUILDS="avx512 avx2 avx512-again"
        if [ "" != "${BASELINE}" ]; then BUILDS="avx512 base-avx512 avx2 base-avx2 avx512-again"; fi
        for BUILD in ${BUILDS}; do
          FORMATS="0 1" # LIBXS_VPACK: the format of a group of 8
          if [ "${BUILD#base-}" != "${BUILD}" ]; then FORMATS="1"; fi # the other format is the same code
          for FORMAT in ${FORMATS}; do
            LABEL="${BUILD}"
            if [ "${BUILD#base-}" != "${BUILD}" ]; then LABEL="${BUILD} (${BASELINE})"; fi
            echo "--- ${LABEL}, LIBXS_VPACK=${FORMAT}" | tee -a "pack-${{ matrix.job }}.log"
            LIBXS_VPACK=${FORMAT} taskset -c "${CPU}" "./pack-${BUILD%-again}.x" ${INPUT_ARGS} \
              | tee -a "pack-${{ matrix.job }}.log"
          done
        done
        {
          echo '```'
          grep -E '^(--- |variant|vpack (group )?8 |vpack deltas|kd-tree rows, exc)' "pack-${{ matrix.job }}.log"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v5
      if: always() && env.UPLOAD != '0'
      with:
        name: pack-${{ matrix.job }}
        path: samples/pack/pack-${{ matrix.job }}.log

  Predict:
    if: github.event.inputs.experiment == 'predict' || github.event.inputs.experiment == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6]
    env:
      PREDICT_ARGS: ${{ github.event.inputs.predict_args }}
      FILE_URL: ${{ github.event.inputs.predict_file_url }}
      HOLDOUT_URL: ${{ github.event.inputs.holdout_url }}
      LIBXSTREAM_ROOT: ${{ github.workspace }}/libxstream
    steps:
    - uses: actions/checkout@v5

    - name: System Information
      run: lscpu

    - name: Setup environment
      if: github.event.inputs.env != ''
      env:
        INPUT_ENV: ${{ github.event.inputs.env }}
      run: |
        for NAME_VALUE in ${INPUT_ENV}; do
          if ! echo "${NAME_VALUE}" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$'; then
            echo "ERROR: \"${NAME_VALUE}\" is not NAME=VALUE"; exit 1
          fi
          echo "${NAME_VALUE}" >> "$GITHUB_ENV"
        done

    - name: Setup LIBXSTREAM
      uses: actions/checkout@v5
      with:
        repository: hfp/libxstream
        path: libxstream

    - name: Install XGBoost
      run: |
        sudo apt update -y
        sudo apt install -y libxgboost-dev

    - name: Build
      working-directory: samples/predict
      run: make -j "$(nproc)" DBG=0 FORTRAN=0 SSE=4 XGB=1 predict_params.x

    - name: Run
      working-directory: samples/predict
      shell: bash
      env:
        BUILD_FLAGS: DBG=0 FORTRAN=0 SSE=4 XGB=1
      run: |
        mkdir -p output
        export OMP_NUM_THREADS=${OMP_NUM_THREADS:-$(nproc)}
        export XGB_NTHREAD=${XGB_NTHREAD:-${OMP_NUM_THREADS}}
        if [ "" != "${HOLDOUT_URL}" ] && [ "" = "${FILE_URL}" ]; then
          echo "ERROR: holdout_url requires predict_file_url"; exit 1
        fi
        if [ "" != "${FILE_URL}" ]; then
          curl -fsSL --proto '=https' --proto-redir '=https' \
            -o output/input.csv "${FILE_URL}"
          FILES=(output/input.csv)
        else
          FILES=("${LIBXSTREAM_ROOT}"/samples/smm/params/tune_multiply_*.csv)
        fi
        if [ "" != "${HOLDOUT_URL}" ]; then
          curl -fsSL --proto '=https' --proto-redir '=https' \
            -o output/holdout.csv "${HOLDOUT_URL}"
          export HOLDOUT="${PWD}/output/holdout.csv"
        fi
        {
          lscpu
          "${CC:-cc}" --version
          git rev-parse HEAD
          git -C "${LIBXSTREAM_ROOT}" rev-parse HEAD
          echo "BUILD_FLAGS=${BUILD_FLAGS}"
          echo "OMP_NUM_THREADS=${OMP_NUM_THREADS} XGB_NTHREAD=${XGB_NTHREAD}"
          ldd predict_params.x
          sha256sum predict_params.x
        } > output/system.txt
        read -r -a ARGS <<< "${PREDICT_ARGS}"
        for CSV in "${FILES[@]}"; do
          if [ ! -f "${CSV}" ]; then
            echo "ERROR: no input CSV: ${CSV}"; exit 1
          fi
          BASE=$(basename "${CSV}" .csv)
          sha256sum "${CSV}" >> output/system.txt
          DUMP="${PWD}/output/${BASE}.dump" DUMP_ALL=1 \
            ./predict_params.x "${ARGS[@]}" "${CSV}" "output/${BASE}.bin" \
            2>&1 | tee "output/${BASE}.log"
        done
        {
          echo '### predict_params.x'
          echo "OMP_NUM_THREADS=${OMP_NUM_THREADS}"
          echo '```'
          grep -hE '^(Loaded|Built|Eval|Decomposition|XGBoost head-to-head)' output/*.log
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v5
      if: always() && env.UPLOAD != '0'
      with:
        name: predict-${{ matrix.job }}
        path: samples/predict/output/
        if-no-files-found: warn
