site_name: LIBXS
site_author: Hans Pabst
copyright: Copyright (c) LIBXS Contributors
site_description: Library of specialized algebra and performance primitives.
repo_url: https://github.com/hfp/libxs/
edit_uri: edit/main/documentation
site_url: https://libxs.readthedocs.io/
docs_dir: documentation

markdown_extensions:
- toc:
    permalink: True
    toc_depth: 3
    title: None
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.details
- md_in_html
- admonition
- attr_list
extra_css:
- style.css

theme:
    name: readthedocs
    custom_dir: .theme

extra:
  collapsed_nav:
    - "Domains"
    - "Samples"
    - "Tests"
    - "More"

plugins:
  - search

hooks:
  - .theme/hook.py

nav:
- Overview: index.md
- Presentations: libxs_present.md
- Fortran: libxs_fortran.md
- Domains:
